[package]
name = "cp2077-mod-tui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An isolated, profile-based Cyberpunk 2077 mod manager and launcher for Linux"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
hex = "0.4"
ratatui = "0.30"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.25"
thiserror = "2.0"
toml = "0.9"
uuid = { version = "1.20", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "thin"
strip = true
